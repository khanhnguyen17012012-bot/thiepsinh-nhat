<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 HAPPY BIRTHDAY CÔ</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif;}
body{overflow:hidden;background:black;color:white;}

.flash{
position:fixed;width:100%;height:100%;
background:white;opacity:0;z-index:999;transition:.3s;
}

.page{
height:100vh;display:flex;justify-content:center;align-items:center;
flex-direction:column;text-align:center;
background:radial-gradient(circle,#1d0036,#000814,#000);
padding:20px;
}

input{
padding:14px;border:none;border-radius:50px;
font-size:18px;text-align:center;width:260px;
}

button{
margin-top:18px;padding:14px 28px;border:none;
border-radius:50px;font-size:18px;font-weight:bold;
cursor:pointer;background:linear-gradient(90deg,#ff00cc,#00ffff);
color:white;
}

#musicBtn{
position:fixed;top:20px;right:20px;
z-index:9999;border-radius:30px;padding:8px 14px;
background:linear-gradient(90deg,#ff00cc,#00ffff);
color:white;cursor:pointer;
}

.birthday{
font-size:70px;
animation:showUp 2s forwards;
text-shadow:0 0 20px #ff00cc,0 0 40px #00ffff;
}

.msg{
margin-top:20px;font-size:22px;line-height:1.8;
text-shadow:0 0 10px cyan;
}

@keyframes showUp{
0%{opacity:0;transform:scale(.2)}
100%{opacity:1;transform:scale(1)}
}

/* hiệu ứng */
.star{position:fixed;width:2px;height:2px;background:white;}
.heart{position:fixed;bottom:-30px;animation:fly 7s linear;}
.balloon{position:fixed;bottom:-120px;width:60px;height:75px;border-radius:50%;animation:balloonFly 10s linear;}
.boom{position:fixed;font-size:24px;animation:explode 1.3s;}

@keyframes fly{100%{transform:translateY(-120vh)}}
@keyframes balloonFly{100%{transform:translateY(-130vh)}}
@keyframes explode{100%{transform:scale(4);opacity:0}}
</style>
</head>

<body>

<div class="flash" id="flash"></div>

<div class="page" id="main">
<h1>🔐 Nhập Mã Bí Mật</h1><br>
<input type="password" id="pin">
<button onclick="check()">Mở Thiệp 🎁</button>
</div>

<div class="page" id="secret" style="display:none;">
<h1 class="birthday">🎂 HAPPY BIRTHDAY 🎂</h1>
<div class="msg">
Chúc mừng sinh nhật cô 🌷<br>
Chúc cô luôn mạnh khỏe, vui vẻ <br>
Hạnh phúc và gặp nhiều may mắn <br>
Cảm ơn cô vì đã luôn tận tâm dạy dỗ chúng em 💖
</div>
</div>

<!-- 🔊 NHẠC -->
<audio id="music" loop>
<source src="nhac.mp4" type="audio/mp4">
</audio>

<button id="musicBtn" onclick="toggleMusic()">🔊 Nhạc</button>

<audio id="whoosh">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-fast-woosh-transition-1486.mp3">
</audio>

<script>
const correct="2404";
let music=document.getElementById("music");
let btn=document.getElementById("musicBtn");

function toggleMusic(){
if(music.paused){
music.play();
btn.innerHTML="🔇 Tắt";
}else{
music.pause();
btn.innerHTML="🔊 Nhạc";
}
}

function check(){
let val=document.getElementById("pin").value;

if(val===correct){

// bật nhạc
music.volume=0.5;
music.play().catch(()=>{});
btn.innerHTML="🔇 Tắt";

document.getElementById("whoosh").play();

setTimeout(()=>{
document.getElementById("main").style.display="none";
document.getElementById("secret").style.display="flex";

stars();hearts();balloons();fireworks();

},300);

}else{
alert("Sai mã 😢");
}
}

function stars(){
for(let i=0;i<120;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
document.body.appendChild(s);
}
}

function hearts(){
setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="💖";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),7000);
},400);
}

function balloons(){
setInterval(()=>{
let b=document.createElement("div");
b.className="balloon";
b.style.left=Math.random()*100+"vw";
b.style.background=["#ff4da6","#00ffff","#ffd700"][Math.floor(Math.random()*3)];
document.body.appendChild(b);
setTimeout(()=>b.remove(),10000);
},800);
}

function fireworks(){
setInterval(()=>{
for(let i=0;i<10;i++){
let f=document.createElement("div");
f.className="boom";
f.innerHTML="🎉";
f.style.left=Math.random()*100+"vw";
f.style.top=Math.random()*100+"vh";
document.body.appendChild(f);
setTimeout(()=>f.remove(),1300);
}
},2000);
}
</script>

</body>
</html>
